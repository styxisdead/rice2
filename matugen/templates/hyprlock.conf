general {
    hide_cursor = true
    disable_loading_bar = true
    no_fade_in = false
    no_fade_out = false
    immediate_render = true
}

background {
    monitor =
    path = {{image}}

    blur_passes = 2
    blur_size = 6
    brightness = 0.65
    contrast = 0.9
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I:%M %p')"

    color = {{colors.on_background.default.rgba}}

    font_size = 64
    font_family = MesloLGLDZ Nerd Font

    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"

    color = {{colors.secondary.default.rgba}}

    font_size = 18
    font_family = MesloLGLDZ Nerd Font

    position = 0, 55
    halign = center
    valign = center
}

input-field {
    monitor =

    size = 280, 55
    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true

    outer_color = {{colors.primary.default.rgba}}
    inner_color = {{colors.background.default.rgba}}
    font_color = {{colors.on_background.default.rgba}}

    fade_on_empty = false
    rounding = 14

    placeholder_text = <i>Password</i>
    fail_text = <i>$FAIL</i>

    position = 0, -60
    halign = center
    valign = center
}
